<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kookatelier Sel &amp; Poivre in Gent: kookworkshops in kleine groepen, met echte chefs.">
  <title>Sel &amp; Poivre – kookatelier in Gent</title>

  <!-- Tailwind CSS 4.3.3 (Play CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Google Fonts: DM Serif Display (titels) en Source Sans 3 (tekst) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Eigen thema en componenten -->
  <style type="text/tailwindcss">
    /* ---------- 1.5 – Oefening 1 - Het startproject van Sel & Poivre ---------- */
    /* Huisstijl van Sel & Poivre: elke variabele in @theme wordt een reeks utility-classes */
    @theme {
      --color-basil: #2f5d50;
      --color-basil-dark: #1f3f36;
      --color-tomato: #d0532f;
      --color-tomato-dark: #a63d20;
      --color-flour: #fbf8f2;
      --color-linen: #f0e8da;
      --color-pepper: #22262a;

      --font-display: "DM Serif Display", Georgia, serif;
      --font-sans: "Source Sans 3", system-ui, sans-serif;
    }
  </style>
</head>
<body class="bg-flour font-sans text-pepper antialiased">
  <main>
    <div class="mx-auto max-w-5xl px-4 py-12">
      <h1 class="font-display text-4xl">Welkom bij Sel &amp; Poivre</h1>
      <p class="mt-3 text-lg text-pepper/75">Staat deze titel in een schreefletter en is de knop hieronder tomatenrood? Dan is alles goed gekoppeld.</p>
      <button type="button" class="mt-6 rounded-full bg-tomato-dark px-6 py-3 font-semibold text-white hover:bg-basil">Testknop</button>
    </div>
  </main>
</body>
</html>
